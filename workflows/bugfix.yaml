name: Bugfix Loop
version: 2
min_spine_version: "0.19.0"
start_node: Reproduce

nodes:
  - name: Reproduce
    kind: agent
    description: "Analyze stack traces and logs. Construct a minimal failing test or reproduction script that reliably fails with concrete runtime output before touching production code."
    retry_policy:
      max_attempts: 2
      backoff_ms: 500

  - name: Isolate
    kind: agent
    description: "Attack the premise: isolate the fundamental root cause in core domain models or shared code rather than patching symptoms downstream."
    retry_policy:
      max_attempts: 2
      backoff_ms: 500

  - name: Fix
    kind: agent
    description: "Implement the smallest complete fix adhering to strict immutability, boundary discipline, zero dead code, and no comments."
    retry_policy:
      max_attempts: 2
      backoff_ms: 1000

  - name: Verify
    kind: checkpoint
    description: "Execute allowlisted verification suite (.verify/run.sh <feature>); confirm regression test passes on fixed code and fails on baseline."
    retry_policy:
      max_attempts: 2
      backoff_ms: 1000

  - name: QualityGate
    kind: verify
    description: "Verify zero test weakening, zero newly added narration comments (scripts/check-added-comments.sh), and all proof logs survive in .verify/artifacts/."

  - name: Review
    kind: agent
    description: "Execute adversarial interrogation; output 4-part findings (Must Fix, Should Fix, Nice to Have), lean assessment, and evidence record."

edges:
  - from: Reproduce
    to: Isolate
  - from: Isolate
    to: Fix
  - from: Fix
    to: Verify
  - from: Verify
    to: QualityGate
  - from: QualityGate
    to: Review
