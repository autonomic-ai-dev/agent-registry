name: Stacked PR & Delivery
version: 2
min_spine_version: "0.19.0"
start_node: InspectStack

nodes:
  - name: InspectStack
    kind: agent
    description: "Audit working tree and branch stack: check rebase order, identify modified symbols, and trace transitive callers (blast-radius)."
    retry_policy:
      max_attempts: 2
      backoff_ms: 500

  - name: AtomicChunking
    kind: agent
    description: "Split changes into reviewable atomic commits with Conventional Commit messages (feat, fix, refactor, test, docs). Verify zero narration comments via check-added-comments.sh."
    retry_policy:
      max_attempts: 2
      backoff_ms: 500

  - name: VerificationGate
    kind: checkpoint
    description: "Run full allowlisted verification (.verify/run.sh all). Ensure all unit, static, and functional suites pass without weakening."
    retry_policy:
      max_attempts: 2
      backoff_ms: 1000

  - name: RichDescription
    kind: agent
    description: "Draft rich PR body: Summary & Problem Intent, HLD with Mermaid flowchart/sequence chart, LLD data contracts, blast radius analysis, and evidence record."

  - name: ApprovalGate
    kind: approval_gate
    description: "Human reviews the drafted PR description, HLD/LLD diagrams, and evidence record before push."

  - name: PushBranch
    kind: agent
    description: "Push rebased branch to remote origin and present ready PR link."

edges:
  - from: InspectStack
    to: AtomicChunking
  - from: AtomicChunking
    to: VerificationGate
  - from: VerificationGate
    to: RichDescription
  - from: RichDescription
    to: ApprovalGate
  - from: ApprovalGate
    to: PushBranch
